server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass http://foodaniel-backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://foodaniel-backend:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compat: all old bundle hashes → current bundle (flat, no chaining)
    location ~* ^/assets/index-(?!dbhVCGLC)[^.]+\.js$  { rewrite ^ /assets/index-dbhVCGLC.js last; }
    location ~* ^/assets/index-(?!NynbsIAk)[^.]+\.css$ { rewrite ^ /assets/index-NynbsIAk.css last; }
}
